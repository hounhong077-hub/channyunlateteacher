<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYIS - ការស្នើសុំមកធ្វើការយឺត</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS សម្រាប់បង្ហាញផែនទី -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            /* កំណត់ Font សម្រាប់ទំព័រទាំងមូល */
            font-family: 'Khmer OS Content', 'Battambang', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }

        .card {
            background: #ffffff; padding: 20px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); width: 100%; max-width: 380px; text-align: center;
        }
        
        .school-logo {
            max-width: 90px;
            max-height: 90px;
            object-fit: contain;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 { font-size: 18px; color: #1a1a1a; margin-bottom: 5px; }
        p { font-size: 12px; color: #666; margin-bottom: 12px; line-height: 1.4; }
        
        #map {
            width: 100%;
            height: 160px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            display: none;
        }

        .upload-box { margin-bottom: 12px; text-align: left; }
        
        label { 
            font-family: inherit; /* ទាញយក Font ពី Body */
            font-size: 12px; font-weight: 600; color: #444; display: block; margin-bottom: 4px; 
        }
        
        input[type="file"] {
            font-family: inherit; /* ទាញយក Font ពី Body */
            width: 100%; padding: 8px; font-size: 12px; border: 1px dashed #2481cc;
            border-radius: 8px; background: #f8fbff; cursor: pointer;
        }

        #preview { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
        
        button {
            font-family: inherit; /* បន្ថែមបន្ទាត់នេះ ដើម្បីឱ្យប៊ូតុងប្រើ Khmer OS Content */
            background-color: #2481cc; color: white; border: none; padding: 12px 20px;
            font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%;
            transition: background 0.3s ease; box-shadow: 0 4px 12px rgba(36, 129, 204, 0.3);
        }
        
        button:hover { background-color: #1d6fa5; }
        button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
        
        #status { 
            font-family: inherit; 
            margin-top: 10px; font-size: 12px; font-weight: 500; min-height: 30px; color: #555; 
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo សាលា -->
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjR9cK7_BjbUQ4THtiR6iLjRdc3TN7o8kTPD7k91b70ixGvhTAdEYFVOnoN1TlSB2LZEX_PNoBOKDOyYtg94vVlATxh7jpWk6ngIY45Ym4S7RzwvnrEyWDDeGX5DkDqfIDCqmXcOEqjZ0x-9xaWyLZ3XOGWeb-I7mc7s93BDsynlqGNuEBRVY0zfg6akWg/s1111/CYIS%20Png.png" alt="សាលាអន្តរជាតិ ចាន់ យុន" class="school-logo">
        
        <h2>ការស្នើសុំមកធ្វើការយឺត</h2>
        <p>រូបថតនិងព័ត៌មានអំពីការមកយឺត</p>
        
        <!-- ប្រអប់បង្ហាញផែនទី និង Pin ទីតាំង -->
        <div id="map"></div>

        <!-- ប្រអប់ Upload រូបភាព -->
        <div class="upload-box">
            <label for="imageInput">📸 ថតរូបភាព ឬជ្រើសរើស:</label>
            <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewImage(event)">
            <img id="preview" alt="Image Preview">
        </div>

        <!-- ប៊ូតុងផ្ញើរ -->
        <button id="locBtn" onclick="getLocationAndSend()">ផ្ញើរ</button>
        <div id="status"></div>
    </div>

    <!-- Leaflet JS សម្រាប់ដំណើរការផែនទី -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let base64Image = "";
        let map, marker;

        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        showMap(lat, lon);
                    },
                    (error) => { console.log("Waiting for location..."); },
                    { enableHighAccuracy: true }
                );
            }
        };

        function showMap(lat, lon) {
            let mapContainer = document.getElementById("map");
            mapContainer.style.display = "block";

            if (!map) {
                map = L.map('map').setView([lat, lon], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);
                marker = L.marker([lat, lon]).addTo(map);
            } else {
                map.setView([lat, lon], 16);
                marker.setLatLng([lat, lon]);
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    compressImage(e.target.result, 600, 0.7, (compressedBase64) => {
                        base64Image = compressedBase64;
                        let preview = document.getElementById("preview");
                        preview.src = compressedBase64;
                        preview.style.display = "block";
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        function compressImage(dataUrl, maxWidth, quality, callback) {
            const img = new Image();
            img.src = dataUrl;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
        }

        function getLocationAndSend() {
            let status = document.getElementById("status");
            let btn = document.getElementById("locBtn");

            if (!navigator.geolocation) {
                status.innerHTML = "❌ Browser របស់អ្នកមិនគាំទ្រការចាប់យកទីតាំងទេ។";
                return;
            }

            status.innerHTML = "⏳ កំពុងផ្ទៀងផ្ទាត់ទីតាំង និងរក្សាទុក...";
            btn.disabled = true;
            btn.style.opacity = "0.7";

            let tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : { id: "unknown", first_name: "WebUser", username: "" };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    
                    showMap(lat, lon);

                    const scriptURL = 'https://script.google.com/macros/s/AKfycbwws0L_NFAZiz3FbVPM75NTH6lDRCPDEQ9hm3t9tyQaqLh-Gm7uHkiCsAzt_YQuRxzu/exec';

                    const payload = {
                        userId: tgUser.id,
                        fullName: `${tgUser.first_name} ${tgUser.last_name || ''}`,
                        username: tgUser.username ? `@${tgUser.username}` : 'គ្មាន',
                        latitude: lat,
                        longitude: lon,
                        mapsUrl: `https://www.google.com/maps?q=${lat},${lon}`,
                        imageUrl: base64Image ? "មានរូបភាព" : "គ្មានរូបភាព" 
                    };

                    fetch(scriptURL, {
                        method: 'POST',
                        mode: 'no-cors',
                        cache: 'no-cache',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    })
                    .then(response => {
                        status.innerHTML = `✅ រក្សាទុកជោគជ័យ!`;
                        setTimeout(() => {
                            tg.close();
                        }, 2000);
                    })
                    .catch(error => {
                        btn.disabled = false;
                        btn.style.opacity = "1";
                        status.innerHTML = "❌ មានបញ្ហា៖ " + error;
                    });
                },
                (error) => {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    status.innerHTML = "❌ មិនអាចទាញយកទីតាំងបានទេ៖ " + error.message;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>

</body>
</html>
