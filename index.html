<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYIS - ការស្នើសុំមកធ្វើការយឺត</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            /* ប្រើប្រាស់ Font Khmer OS Content */
            font-family: 'Khmer OS Content', 'Battambang', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px;
        }
        .card {
            background: #ffffff; padding: 20px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); width: 100%; max-width: 380px; text-align: center;
        }
        .school-logo { max-width: 90px; max-height: 90px; object-fit: contain; margin-bottom: 10px; display: inline-block; }
        h2 { font-size: 18px; color: #1a1a1a; margin-bottom: 5px; }
        p { font-size: 12px; color: #666; margin-bottom: 15px; line-height: 1.4; }
        .upload-box { margin-bottom: 15px; text-align: left; }
        label { font-family: inherit; font-size: 12px; font-weight: 600; color: #444; display: block; margin-bottom: 4px; }
        input[type="file"] {
            font-family: inherit; width: 100%; padding: 8px; font-size: 12px; border: 1px dashed #2481cc;
            border-radius: 8px; background: #f8fbff; cursor: pointer;
        }
        #preview { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
        button {
            font-family: inherit; background-color: #2481cc; color: white; border: none; padding: 12px 20px;
            font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%;
            transition: background 0.3s ease; box-shadow: 0 4px 12px rgba(36, 129, 204, 0.3);
        }
        button:hover { background-color: #1d6fa5; }
        button:disabled { background-color: #ccc; cursor: not-allowed; box-shadow: none; }
        #status { font-family: inherit; margin-top: 10px; font-size: 12px; font-weight: 500; min-height: 30px; color: #555; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjR9cK7_BjbUQ4THtiR6iLjRdc3TN7o8kTPD7k91b70ixGvhTAdEYFVOnoN1TlSB2LZEX_PNoBOKDOyYtg94vVlATxh7jpWk6ngIY45Ym4S7RzwvnrEyWDDeGX5DkDqfIDCqmXcOEqjZ0x-9xaWyLZ3XOGWeb-I7mc7s93BDsynlqGNuEBRVY0zfg6akWg/s1111/CYIS%20Png.png" alt="សាលាអន្តរជាតិ ចាន់ យុន" class="school-logo">
        
        <h2>ការស្នើសុំមកធ្វើការយឺត</h2>
        <p>រូបថតនិងព័ត៌មានអំពីការមកយឺត</p>

        <div class="upload-box">
            <label for="imageInput">📸 ថតរូបភាព ឬជ្រើសរើស:</label>
            <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewImage(event)">
            <img id="preview" alt="Image Preview">
        </div>

        <button id="locBtn" onclick="getLocationAndSend()">ផ្ញើរ</button>
        <div id="status"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let base64Image = "";

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    compressImage(e.target.result, 600, 0.7, (compressedBase64) => {
                        base64Image = compressedBase64;
                        let preview = document.getElementById("preview");
                        preview.src = compressedBase64;
                        preview.style.display = "block";
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        function compressImage(dataUrl, maxWidth, quality, callback) {
            const img = new Image();
            img.src = dataUrl;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
        }

        async function getLocationAndSend() {
            let status = document.getElementById("status");
            let btn = document.getElementById("locBtn");

            if (!base64Image) {
                status.innerHTML = "⚠️ សូមថតរូបភាព ឬជ្រើសរើសរូបភាពជាមុនសិន!";
                return;
            }

            if (!navigator.geolocation) {
                status.innerHTML = "❌ Browser មិនគាំទ្រការចាប់យកទីតាំងទេ។";
                return;
            }

            status.innerHTML = "⏳ កំពុងផ្ទៀងផ្ទាត់ទីតាំង...";
            btn.disabled = true;
            btn.style.opacity = "0.7";

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    
                    // បង្កើត Google Maps URL
                    let mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                    let tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : { id: "unknown", first_name: "WebUser" };
                    let fullName = `${tgUser.first_name} ${tgUser.last_name || ''}`.trim();
                    let username = tgUser.username ? `@${tgUser.username}` : 'គ្មាន';

                    status.innerHTML = "⏳ កំពុងរក្សាទុក និង Upload រូបភាព...";

                    // ដាក់ Link Google Apps Script របស់អ្នកនៅទីនេះ
                    const scriptURL = 'ដាក់_Link_Apps_Script_នៅទីនេះ'; 
                    let imageUrl = "គ្មានរូបភាព";

                    try {
                        const response = await fetch(scriptURL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                userId: tgUser.id,
                                fullName: fullName,
                                username: username,
                                latitude: lat,
                                longitude: lon,
                                mapUrl: mapUrl,
                                imageBase64: base64Image
                            })
                        });
                        const result = await response.json();
                        
                        if (result.imageUrl) {
                            imageUrl = result.imageUrl;
                        }
                    } catch (error) {
                        console.log("Error: ", error);
                    }

                    // បញ្ជូនទៅ Bot ដើម្បីផ្ញើទៅក្រុម
                    tg.sendData(JSON.stringify({
                        latitude: lat,
                        longitude: lon,
                        mapUrl: mapUrl,
                        imageUrl: imageUrl,
                        fullName: fullName,
                        username: username,
                        userId: tgUser.id
                    }));

                    status.innerHTML = `✅ ផ្ញើជោគជ័យ!`;
                },
                (error) => {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    status.innerHTML = "❌ មិនអាចទាញយកទីតាំងបានទេ៖ " + error.message;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
